name: Bug report
description: Something looks wrong or does not work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the problem is a **missing or wrong sensor value**, please report it to the
        [integration](https://github.com/nagelm/metservice-weather/issues) instead, because the card can only display what the sensors provide.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I updated the `?v=` number in the Resources URL (or updated through HACS) and hard-refreshed the browser
          required: true
        - label: I read the Troubleshooting section of the README
          required: true
  - type: input
    id: card_version
    attributes:
      label: Card version
      description: Shown in the browser console as `METSERVICE-WEATHER-CARD v...`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version and integration version
      placeholder: "Home Assistant 2026.8.2, metservice-weather 1.x"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser or app, and device
      placeholder: "Home Assistant Companion app on Android, or Chrome on Windows"
  - type: dropdown
    id: scheme
    attributes:
      label: Theme mode
      options:
        - Dark
        - Light
        - Automatic (changes with the time of day or the device)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: The YAML of the card (remove anything private).
      render: yaml
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: Drag and drop images here.
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open the developer tools (F12), look at the Console, and paste any red errors that mention the card.
      render: shell
